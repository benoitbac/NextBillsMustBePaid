name: 🐛 Bug report
description: Quelque chose ne fonctionne pas comme prévu
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ?
      placeholder: Quand je fais X, Y arrive au lieu de Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller à '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: 'OS, navigateur, version…'
    validations:
      required: false
