name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (dont les controles negatifs)
        run: npm test
      - name: Build
        run: npm run build

  balance:
    # L'equilibrage est une affirmation : la CI la verifie sur un echantillon
    # reduit. Une campagne complete (3600 runs, ~6 min) se lance a la main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Campagne courte
        run: npm run sim -- --runs 40
